# ==========================================
# APPLICATION
# ==========================================
spring.application.name=e-learning
server.port=8080

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/elearning_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# SERVER
# ==========================================

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=DEBUG

# ==========================================
# JWT
# ==========================================
app.jwt.secret=MyVeryLongSecretKeyForLearningPathPlatformProject2026
app.jwt.expiration=86400000

# ==========================================
# SWAGGER
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
